name: Sync MainUI

on:
  push:
    paths:
      - 'miyoo/MainUI'
      - 'miyoo285/MainUI'
      - 'miyoo354/MainUI'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed MainUI files
        id: detect
        run: |
          # List files changed in HEAD
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(miyoo|miyoo285|miyoo354)/MainUI$' || true)

          echo "changed=$CHANGED"
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate exactly one modified file
        run: |
          COUNT=$(echo "${{ steps.detect.outputs.changed }}" | sed '/^\s*$/d' | wc -l)

          echo "Changed file count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No MainUI files changed — nothing to sync."
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: Multiple MainUI files changed in one commit."
            echo "This workflow refuses to auto-sync ambiguous updates."
            echo "Please modify only ONE of the three files per commit."
            exit 1
          fi

      - name: Identify source file
        id: source
        run: |
          SRC=$(echo "${{ steps.detect.outputs.changed }}" | sed '/^\s*$/d')
          echo "source=$SRC" >> $GITHUB_OUTPUT

      - name: Sync to other paths
        run: |
          SRC="${{ steps.source.outputs.source }}"

          declare -a ALL=("miyoo/MainUI" "miyoo285/MainUI" "miyoo354/MainUI")

          for TARGET in "${ALL[@]}"; do
            if [ "$TARGET" != "$SRC" ]; then
              cp "$SRC" "$TARGET"
            fi
          done

      - name: Commit synced copies
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add miyoo/MainUI miyoo285/MainUI miyoo354/MainUI

          git commit -m "Sync MainUI from ${ { steps.source.outputs.source } }" || echo "No changes to commit"

          git push
